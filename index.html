<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErrorTriage Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: radial-gradient(circle at top, rgba(16, 185, 129, 0.12), transparent 35%);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-emerald-400">ErrorTriage Local</h1>
            <p class="text-gray-400 text-sm mt-2">Offline error log triage using a local or network-reachable Ollama endpoint.</p>
        </header>

        <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700 mb-6">
            <div class="grid md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="ollamaUrl" class="block text-sm font-semibold mb-2 text-gray-300">Ollama Base URL</label>
                    <input id="ollamaUrl" type="text" value="http://localhost:11434" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label for="modelName" class="block text-sm font-semibold mb-2 text-gray-300">Model Name</label>
                    <input id="modelName" type="text" value="qwen3.8:27b" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div class="mb-4 rounded-lg border border-amber-500/40 bg-amber-900/20 p-3 text-sm text-amber-100">
                GitHub Pages cannot reach your machine's localhost. If this app is deployed online, point the Ollama URL to a public or network-accessible server running Ollama.
            </div>

            <label class="block text-sm font-semibold mb-2 text-gray-300">Paste your raw terminal error log:</label>
            <textarea id="errorLog" rows="6" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-200 focus:outline-none focus:border-emerald-500 font-mono" placeholder="Example: Traceback ..."></textarea>

            <button onclick="triageError()" id="submitBtn" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Triage Error Locally
            </button>
        </div>

        <div id="outputContainer" class="hidden bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-lg font-bold text-emerald-400 mb-3">Analysis & Local Patch</h2>
            <div id="resultText" class="text-sm text-gray-300 whitespace-pre-wrap font-mono bg-gray-900 p-4 rounded-lg border border-gray-700"></div>
        </div>
    </div>

    <script>
        async function triageError() {
            const logInput = document.getElementById('errorLog').value.trim();
            const outputContainer = document.getElementById('outputContainer');
            const resultText = document.getElementById('resultText');
            const submitBtn = document.getElementById('submitBtn');
            const ollamaUrl = document.getElementById('ollamaUrl').value.trim().replace(/\/$/, '');
            const modelName = document.getElementById('modelName').value.trim();

            if (!logInput) {
                alert('Please paste an error log first!');
                return;
            }

            if (!ollamaUrl || !modelName) {
                alert('Please provide both an Ollama URL and a model name.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Analyzing locally...';
            outputContainer.classList.remove('hidden');
            resultText.textContent = 'Connecting to Ollama...';

            try {
                const response = await fetch(`${ollamaUrl}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: modelName,
                        messages: [
                            { role: 'system', content: 'You are an expert offline debugging agent. Break down the error into: 1) Root Cause, 2) Affected File/Line, and 3) Local Patch.' },
                            { role: 'user', content: logInput }
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                resultText.textContent = data.message?.content || 'No reply received from the model.';
            } catch (error) {
                resultText.textContent = `Error: Could not reach Ollama at ${ollamaUrl}.\n\nMake sure your Ollama service is running and reachable from this browser.\n\nDetails: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Triage Error Locally';
            }
        }
    </script>
</body>
</html>
